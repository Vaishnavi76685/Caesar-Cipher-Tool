
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Encryption Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Caesar Cipher Tool</h1>
        <p>Encrypt and Decrypt Your Messages</p>
    </header>

    <main class="container">

        <section class="cipher-box">
            <h2>Cryptography Tool</h2>

            <label for="inputText">Enter Your Message</label>
            <textarea id="inputText"
                placeholder="Type your message here..."></textarea>

            <label for="shiftKey">Enter Shift Key (1-25)</label>
            <input type="number" id="shiftKey"
                min="1" max="25" value="3">

            <div class="buttons">
                <button id="encryptBtn">Encrypt</button>
                <button id="decryptBtn">Decrypt</button>
            </div>

            <label for="outputText">Result</label>
            <textarea id="outputText"
                placeholder="Your result will appear here..."
                readonly></textarea>

            <div class="buttons">
                <button id="copyBtn">Copy Result</button>
                <button id="clearBtn">Clear All</button>
            </div>

        </section>

    </main>

    <footer>
        <p>Caesar Cipher Tool | Cybersecurity Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
